name: test

on:
  push:
    branches: [sandbox]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mpn_e2e
          POSTGRES_PASSWORD: mpn_e2e
          POSTGRES_DB: mpn_e2e
          TZ: America/Sao_Paulo
          PGTZ: America/Sao_Paulo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mpn_e2e -d mpn_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
