# Postgres só de e2e. Não aponta para o banco de desenvolvimento.
#   docker compose -f docker-compose.e2e.yml up -d
#   npm run db:seed:e2e
services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: mpn_e2e
      POSTGRES_PASSWORD: mpn_e2e
      POSTGRES_DB: mpn_e2e
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpn_e2e -d mpn_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10
